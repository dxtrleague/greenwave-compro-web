services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenwave-app
    ports:
      - "8003:8003"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=8003
    # Use polling if hot-reload feels slow on some systems, but user said not needed.
    # - WATCHPACK_POLLING=true
    command: npm run dev -- -p 8003
